<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>بسّطنا الإنجليزي — مس. شيرهان علي</title>
    <meta name="description" content="منصة بسّطنا الإنجليزي: كورسات إنجليزي مرتبة حسب مرحلتك الدراسية، فيديوهات لكل كورس، ومتابعة مباشرة مع مس. شيرهان علي." />
    <meta name="theme-color" content="#0B1D38" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="بسّطنا الإنجليزي" />
    <meta property="og:description" content="الإنجليزي يبقى سهل وبسيط مع مس. شيرهان." />
    <meta property="og:locale" content="ar_EG" />

    <!-- أيقونة الموقع (SVG جاهزة، مفيش ملف خارجي) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C79A3D'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='800' font-size='28' text-anchor='middle' fill='%230B1D38'%3EEN%3C/text%3E%3C/svg%3E" />

    <!-- الخطوط: Cairo للنص و El Messiri للعناوين والأرقام -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=El+Messiri:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- يمنع وميض الأبيض: بيطبّق الثيم واللغة قبل ما الصفحة تترسم -->
    <script>
      try {
        var t = localStorage.getItem('basetna_theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var l = localStorage.getItem('basetna_lang') || 'ar';
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.lang = l;
        r.dir = l === 'ar' ? 'rtl' : 'ltr';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0A1424' : '#0B1D38');
      } catch (e) {}
    </script>
    <style>
      html { background: #FAF6EE; }
      html[data-theme='dark'] { background: #0A1424; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>لازم تفعّل JavaScript عشان الموقع يشتغل. / Please enable JavaScript to use this site.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
